<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Decision</title><link rel="stylesheet" href="/static/styles.css"></head><body><main><p class="eyebrow">Decision {{ decision.decision_id }}</p><h1 class="action {{ decision.action.value|lower }}">{{ decision.action.value }}</h1><p class="lede">Selected: {{ decision.selected_sku or 'None' }}</p><section><h2>Reason codes</h2><ul>{% for reason in decision.reason_codes %}<li>{{ reason.value }}</li>{% endfor %}</ul></section>{% if decision.action.value == 'ALLOW' %}<form action="/purchase/{{ intent_id }}" method="post"><button>Confirm purchase</button></form>{% else %}<a class="button secondary" href="/evidence/{{ intent_id }}">Review evidence</a>{% endif %}</main></body></html>

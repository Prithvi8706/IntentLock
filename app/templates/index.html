<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Decision Guard</title><link rel="stylesheet" href="/static/styles.css"></head>
<body><main><p class="eyebrow">Agentic checkout safety</p><h1>Validate the decision<br>before the payment.</h1><p class="lede">Confirm buyer intent, isolate untrusted catalogue text, and let deterministic code control checkout.</p>
{% if error %}<p class="error">{{ error }}</p>{% endif %}<form action="/intent" method="post"><label>What should the buyer find?</label><textarea name="raw_request" required>{{ raw_request or 'Outdoor basketball shoes under 6000, preferably Brand A' }}</textarea><fieldset><legend>Guard mode</legend><label class="toggle"><input type="radio" name="guard_mode" value="on" checked> On — protected</label><label class="toggle"><input type="radio" name="guard_mode" value="off"> Off — baseline</label></fieldset><button>Compile intent</button></form></main></body></html>
